<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keycheat — cheatsheet</title>
<style>
  :root {
    --crust: #181926;
    --mantle: #1e2030;
    --base: #24273a;
    --surface0: #363a4f;
    --surface1: #494d64;
    --overlay0: #6e738d;
    --subtext: #a5adcb;
    --text: #cad3f5;
    --mauve: #c6a0f6;
    --pink: #f5bde6;
    --lavender: #b7bdf8;
    --blue: #8aadf4;
    --green: #a6da95;
    --peach: #f5a97f;
    --teal: #8bd5ca;
    --red: #ed8796;
    --yellow: #eed49f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--mantle);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }

  header { margin-bottom: 20px; }
  h1 {
    margin: 0 0 4px;
    font-size: 30px;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--mauve), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { color: var(--overlay0); font-size: 13px; }

  .searchbar { position: sticky; top: 0; z-index: 5; padding: 12px 0; background: linear-gradient(var(--mantle) 70%, transparent); }
  #q {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    color: var(--text);
    background: var(--base);
    border: 1px solid var(--surface0);
    border-radius: 10px;
    outline: none;
  }
  #q:focus { border-color: var(--mauve); box-shadow: 0 0 0 3px rgba(198,160,246,.15); }
  #q::placeholder { color: var(--overlay0); }

  section { margin-top: 28px; }
  .shead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .shead h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .count { color: var(--overlay0); font-size: 12px; }
  .badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--yellow); border: 1px solid var(--surface1);
    border-radius: 999px; padding: 1px 7px;
  }
  .kind { color: var(--overlay0); font-size: 11px; }

  .binding {
    display: grid;
    grid-template-columns: minmax(150px, max-content) 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 9px 12px;
    border-radius: 8px;
    border-bottom: 1px solid var(--surface0);
  }
  .binding:hover { background: var(--base); }
  .binding.hidden { display: none; }

  .keys { white-space: nowrap; }
  kbd {
    font: 12px/1 ui-monospace, "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    display: inline-block;
    padding: 4px 7px;
    margin: 1px;
    color: var(--text);
    background: var(--surface0);
    border: 1px solid var(--surface1);
    border-bottom-width: 2px;
    border-radius: 6px;
  }
  .sep { color: var(--overlay0); font-size: 11px; margin: 0 6px; font-style: italic; }
  .desc { color: var(--text); }
  .action { color: var(--overlay0); font: 12px ui-monospace, Consolas, monospace; text-align: right; }

  .empty { color: var(--overlay0); text-align: center; padding: 40px 0; }
  footer { margin-top: 40px; color: var(--overlay0); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>keycheat</h1>
    <div class="sub" id="sub"></div>
  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="Filter by key, description or command…  (try: alt space, ctrl+space c, workspace)" autocomplete="off" spellcheck="false">
  </div>

  <div id="content"></div>
  <div class="empty" id="empty" style="display:none">No matching shortcuts.</div>

  <footer>
    Prototype — data embedded for standalone use (normally generated from <code>keybindings.json</code>).
  </footer>
</div>

<script type="application/json" id="data">
{
  "generated_at": "2026-10-13T00:00:00Z",
  "sources": [
    {
      "id": "wezterm", "name": "WezTerm", "extraction": "runtime", "sample": false,
      "bindings": [
        { "keys": ["Ctrl+Space", "C"], "action": "SpawnTab CurrentPaneDomain", "description": "New tab" },
        { "keys": ["Ctrl+Space", "X"], "action": "CloseCurrentTab", "description": "Close current tab" },
        { "keys": ["Ctrl+Space", "B"], "action": "ActivateTabRelative -1", "description": "Previous tab" },
        { "keys": ["Ctrl+Space", "N"], "action": "ActivateTabRelative 1", "description": "Next tab" },
        { "keys": ["Ctrl+Space", "W"], "action": "ShowLauncherArgs FUZZY|WORKSPACES", "description": "Workspace / fuzzy launcher" },
        { "keys": ["Ctrl+Space", "\\"], "action": "SplitHorizontal", "description": "Split horizontally" },
        { "keys": ["Ctrl+Space", "-"], "action": "SplitVertical", "description": "Split vertically" },
        { "keys": ["Ctrl+Space", "H"], "action": "ActivatePaneDirection Left", "description": "Focus pane left" },

        { "keys": ["Ctrl+Space", "\u2190"], "action": "AdjustPaneSize Left 5", "description": "Resize pane left" },
        { "keys": ["Ctrl+Space", "\u2192"], "action": "AdjustPaneSize Right 5", "description": "Resize pane right" },
        { "keys": ["Ctrl+Space", "\u2193"], "action": "AdjustPaneSize Down 5", "description": "Resize pane down" },
        { "keys": ["Ctrl+Space", "\u2191"], "action": "AdjustPaneSize Up 5", "description": "Resize pane up" },
        { "keys": ["Ctrl+Space", "1..9"], "action": "ActivateTab n-1", "description": "Activate tab 1\u20139" },
        { "keys": ["Ctrl+Space", "0"], "action": "ActivateTab 9", "description": "Activate tab 10" }
      ]
    },
    {
      "id": "flow-launcher", "name": "Flow Launcher", "extraction": "static", "sample": false,
      "bindings": [
        { "keys": ["Alt+Space"], "action": "Hotkey", "description": "Open / hide Flow Launcher" },
        { "keys": ["F1"], "action": "PreviewHotkey", "description": "Preview result" },
        { "keys": ["Ctrl+Tab"], "action": "AutoCompleteHotkey", "description": "Autocomplete query" },
        { "keys": ["Tab"], "action": "SelectNextItemHotkey", "description": "Select next item" },
        { "keys": ["Shift+Tab"], "action": "SelectPrevItemHotkey", "description": "Select previous item" },
        { "keys": ["PageUp"], "action": "SelectNextPageHotkey", "description": "Next page of results" },
        { "keys": ["PageDown"], "action": "SelectPrevPageHotkey", "description": "Previous page of results" },
        { "keys": ["Ctrl+O"], "action": "OpenContextMenuHotkey", "description": "Open context menu" },
        { "keys": ["Ctrl+I"], "action": "SettingWindowHotkey", "description": "Open settings" },
        { "keys": ["Ctrl+H"], "action": "OpenHistoryHotkey", "description": "Open history" },
        { "keys": ["Alt+Up"], "action": "CycleHistoryUpHotkey", "description": "Cycle history up" },
        { "keys": ["Alt+Down"], "action": "CycleHistoryDownHotkey", "description": "Cycle history down" },
        { "keys": ["Alt+G"], "action": "DialogJumpHotkey", "description": "Dialog jump" }
      ]
    },
    {
      "id": "glazewm", "name": "GlazeWM", "extraction": "static", "sample": true,
      "bindings": [
        { "keys": ["Alt+Shift+Q"], "action": "wm-exit", "description": "Quit GlazeWM" },
        { "keys": ["Alt+Shift+R"], "action": "wm-reload-config", "description": "Reload configuration" },
        { "keys": ["Alt+H"], "action": "focus left", "description": "Focus window left" },
        { "keys": ["Alt+J"], "action": "focus down", "description": "Focus window down" },
        { "keys": ["Alt+K"], "action": "focus up", "description": "Focus window up" },

        { "keys": ["Alt+Shift+J"], "action": "resize down", "description": "Resize window down" },
        { "keys": ["Alt+Shift+K"], "action": "resize up", "description": "Resize window up" },
        { "keys": ["Alt+Shift+L"], "action": "resize right", "description": "Resize window right" },
        { "keys": ["Alt+1..9"], "action": "focus workspace n", "description": "Focus workspace 1\u20139" },
        { "keys": ["Alt+Shift+1..9"], "action": "move to workspace n", "description": "Move window to workspace 1\u20139" }
      ]
    },
    {
      "id": "neovim", "name": "Neovim", "extraction": "runtime", "sample": true,
      "bindings": [
        { "keys": ["Space", "F", "F"], "action": "telescope find_files", "description": "Find files" },
        { "keys": ["Space", "F", "G"], "action": "telescope live_grep", "description": "Live grep" },
        { "keys": ["Space", "E"], "action": "nvim-tree toggle", "description": "Toggle file explorer" },
        { "keys": ["G", "D"], "action": "vim.lsp.buf.definition", "description": "Go to definition" },
        { "keys": ["Space", "W"], "action": "write", "description": "Save file" }
      ]
    }
  ]
}
</script>

<script>
(function () {
  var COLORS = { "wezterm": "var(--blue)", "flow-launcher": "var(--peach)", "glazewm": "var(--green)", "neovim": "var(--mauve)" };
  var data = JSON.parse(document.getElementById("data").textContent);

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function keysHTML(keys) {
    return keys.map(function (chord) {
      return chord.split("+").map(function (k) { return "<kbd>" + esc(k) + "</kbd>"; }).join("");
    }).join('<span class="sep">then</span>');
  }
  function norm(s) { return String(s).toLowerCase().replace(/\+/g, " ").replace(/\s+/g, " ").trim(); }

  var rows = [];
  var content = document.getElementById("content");

  data.sources.forEach(function (src) {
    var color = COLORS[src.id] || "var(--lavender)";
    var sec = document.createElement("section");

    var head = document.createElement("div");
    head.className = "shead";
    head.innerHTML =
      '<span class="dot" style="background:' + color + '"></span>' +
      "<h2>" + esc(src.name) + "</h2>" +
      '<span class="count">' + src.bindings.length + "</span>" +
      '<span class="kind" title="static = parsed from the config file; runtime = queried from the running app">' + esc(src.extraction) + "</span>" +
      (src.sample ? '<span class="badge" title="placeholder data for the demo, not from a real config">sample</span>' : "");
    sec.appendChild(head);

    src.bindings.forEach(function (b) {
      var row = document.createElement("div");
      row.className = "binding";
      row.innerHTML =
        '<div class="keys">' + keysHTML(b.keys) + "</div>" +
        '<div class="desc">' + esc(b.description) + "</div>" +
        '<div class="action">' + esc(b.action) + "</div>";
      row._hay = norm(src.name + " " + b.keys.join(" ") + " " + b.description + " " + b.action);
      sec.appendChild(row);
      rows.push(row);
    });

    content.appendChild(sec);
  });

  var total = rows.length;
  var sub = document.getElementById("sub");
  sub.textContent = total + " shortcuts from " + data.sources.length + " sources \u00b7 generated " + data.generated_at.slice(0, 10);

  var q = document.getElementById("q");
  var empty = document.getElementById("empty");

  function filter() {
    var tokens = norm(q.value).split(" ").filter(Boolean);
    var shown = 0;
    rows.forEach(function (row) {
      var hit = tokens.every(function (t) { return row._hay.indexOf(t) !== -1; });
      row.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    empty.style.display = shown ? "none" : "block";
    document.querySelectorAll("section").forEach(function (sec) {
      var any = sec.querySelectorAll(".binding:not(.hidden)").length > 0;
      sec.style.display = any ? "" : "none";
    });
  }
  q.addEventListener("input", filter);
  q.addEventListener("keydown", function (e) { if (e.key === "Escape") { q.value = ""; filter(); } });
  filter();
})();
</script>
</body>
</html>
